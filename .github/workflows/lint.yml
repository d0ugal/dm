name: Lint

on:
  push:
    branches: ["master", "main"]
  pull_request: {}

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npx --yes prettier@latest --check "**/*.{html,css,js,json,md}"
